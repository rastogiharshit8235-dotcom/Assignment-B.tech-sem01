
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Student Internship Application Form">
    <meta name="author" content="Harshit Rastogi">

    <title>Student Internship Application Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Application Form</h1>
        <p>Student Internship Application · * Required</p>

        <form action="#" method="get">

            <!-- Personal Details -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="fullname">Full Name *</label>
                <input type="text" id="fullname" name="fullname"
                    placeholder="Harshit Rastogi"
                    minlength="3" required>

                <label for="email">Email *</label>
                <input type="email" id="email" name="email"
                    placeholder="example@gmail.com" required>

                <label for="password">Password *</label>
                <input type="password" id="password" name="password"
                    placeholder="Enter password"
                    minlength="8" required>

                <label for="phone">Phone *</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="9876543210"
                    pattern="[6-9][0-9]{9}"
                    title="Enter a valid 10-digit Indian mobile number"
                    required>

                <label for="portfolio">Portfolio URL</label>
                <input type="url" id="portfolio" name="portfolio"
                    placeholder="https://example.com">

                <label for="age">Age *</label>
                <input type="number" id="age" name="age"
                    min="17" max="35"
                    placeholder="Enter your age" required>

                <p>Gender:</p>

                <input type="radio" id="male" name="gender" value="Male">
                <label for="male" class="inline">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female" class="inline">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other" class="inline">Other / Prefer not to say</label>

            </fieldset>

            <!-- Education Details -->
            <fieldset>
                <legend>Education</legend>

                <label for="course">Course *</label>

                <select id="course" name="course" required>
                    <option value="">Select your course</option>
                    <option value="BTech CS">B.Tech Computer Science</option>
                    <option value="BTech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                </select>

                <label for="city">Preferred City</label>

                <input type="text" id="city" name="city"
                    list="cities" placeholder="Enter preferred city">

                <datalist id="cities">
                    <option value="Bareilly">
                    <option value="Delhi">
                    <option value="Noida">
                    <option value="Gurugram">
                    <option value="Rudrapur">
                </datalist>

                <p>Skills:</p>

                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html" class="inline">HTML</label>

                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css" class="inline">CSS</label>

                <input type="checkbox" id="javascript" name="skills" value="JavaScript">
                <label for="javascript" class="inline">JavaScript</label>

                <input type="checkbox" id="java" name="skills" value="Java">
                <label for="java" class="inline">Java</label>

            </fieldset>

            <!-- Upload and Extras -->
            <fieldset>
                <legend>Upload & Extras</legend>

                <label for="date">Available From</label>
                <input type="date" id="date" name="date">

                <label for="time">Interview Time</label>
                <input type="time" id="time" name="time">

                <label for="resume">Resume *</label>
                <input type="file" id="resume" name="resume"
                    accept=".pdf,.doc,.docx" required>

                <label for="stipend">
                    Expected Monthly Stipend:
                    ₹<output id="amount">10000</output>
                </label>

                <input type="range" id="stipend" name="stipend"
                    min="5000" max="30000" step="1000" value="10000">

                <label for="color">Favourite Colour</label>
                <input type="color" id="color" name="color" value="#176f73">

                <label for="reason">Why would you like to join?</label>

                <textarea id="reason" name="reason"
                    rows="5"
                    placeholder="Write your reason here..."
                    minlength="10"
                    required></textarea>

            </fieldset>

            <!-- Buttons -->
            <div class="buttons">

                <button type="submit">Submit Application</button>

                <button type="reset" class="reset">
                    Reset
                </button>

            </div>

        </form>

        <footer>
            <p>© 2026 Harshit Rastogi | Invertis University</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
