
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #edf3f5;
            padding: 25px;
        }

        /* Navigation Bar */

        .navbar {
            background: #174448;
            color: white;
            padding: 18px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        /* Hero Section */

        .hero {
            background: #dcebe5;
            min-height: 350px;
            padding: 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;

            text-align: center;
        }

        .hero h1 {
            color: #253e50;
            font-size: 32px;
        }

        .hero p {
            color: #52666e;
            font-size: 17px;
        }

        .hero button {
            background: #176c70;
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .hero button:hover {
            background: #125457;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            CAMPUS STORE
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <section class="hero">

        <h1>Small essentials. Big campus energy.</h1>

        <p>
            Everything you need for a productive semester.
        </p>

        <button>Explore</button>

    </section>

</body>
</html>
